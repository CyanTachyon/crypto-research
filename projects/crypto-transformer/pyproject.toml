[project]
name = "crypto-transformer"
version = "0.1.0"
description = "Decoder-only Transformer for cryptocurrency quantitative trading"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"
