data:
  binance_pairs:
    - "ETH/USDT"
    - "BTC/USDT"
  timeframe: "1h"
  train_cutoff: "2025-12-01"
  val_fraction: 0.2
  prediction_horizon: 4
  label_threshold: 0.01
  walk_forward_windows: 3

features:
  v2: true
  multi_timeframe: true
  cross_asset: true
  indicators:
    rsi_period: 14
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    atr_period: 14
    bb_period: 20
    bb_std: 2.0
    volume_ma_period: 20
  atr_normalize: true

dataset:
  seq_len: 128
  num_features: 25

model:
  d_model: 128
  nhead: 4
  num_layers: 4
  dim_feedforward: 512
  dropout: 0.2
  num_classes: 3
  use_focal_loss: true
  focal_gamma: 2.0
  regression_weight: 0.3
  classification_weight: 0.7

training:
  batch_size: 64
  learning_rate: 1.0e-4
  weight_decay: 0.01
  max_epochs: 100
  patience: 15
  gradient_clip: 1.0
  num_workers: 0

backtesting:
  initial_capital: 10000
  fee_rate: 0.001
  slippage: 0.0005
  position_fraction: 0.25
  confidence_threshold: 0.55
  min_pred_return: 0.002
